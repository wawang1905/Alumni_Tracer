<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTP Alumni Tracer - System Logs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="DeveloperCommon.css">
</head>
<body>
    <div class="developer-shell">
        <aside class="developer-sidebar">
            <div class="developer-brand">
                <div class="developer-brand-mark">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div>
                    <h1>Developer</h1>
                    <p>System Administrator</p>
                </div>
            </div>

            <nav class="developer-nav" aria-label="Developer navigation">
                <a href="Overview.html" class="developer-nav-item">
                    <i class="fas fa-gauge-high"></i>
                    <span>Overview</span>
                </a>
                <a href="UserManagement.html" class="developer-nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span>User Management</span>
                </a>
                <a href="SystemSettings.html" class="developer-nav-item">
                    <i class="fas fa-sliders-h"></i>
                    <span>System Settings</span>
                </a>
                <a href="SchoolInfo.html" class="developer-nav-item">
                    <i class="fas fa-school"></i>
                    <span>School Info</span>
                </a>
                <a href="BackupRestore.html" class="developer-nav-item">
                    <i class="fas fa-database"></i>
                    <span>Backup & Restore</span>
                </a>
                <a href="SystemLogs.html" class="developer-nav-item active">
                    <i class="fas fa-clipboard-list"></i>
                    <span>System Logs</span>
                </a>
                <a href="Announcements.html" class="developer-nav-item">
                    <i class="fas fa-bullhorn"></i>
                    <span>Announcements</span>
                </a>
                <a href="EmailSMS.html" class="developer-nav-item">
                    <i class="fas fa-envelope-open-text"></i>
                    <span>Email & SMS</span>
                </a>
                <a href="SurveyTemplates.html" class="developer-nav-item">
                    <i class="fas fa-file-signature"></i>
                    <span>Survey Templates</span>
                </a>
                <a href="Maintenance.html" class="developer-nav-item">
                    <i class="fas fa-power-off"></i>
                    <span>Maintenance</span>
                </a>
            </nav>
        </aside>

        <main class="developer-main">
            <header class="developer-topbar">
                <div>
                    <p class="eyebrow">Application Maintenance</p>
                    <h2 id="developerPageTitle">System Logs</h2>
                </div>
                <div class="developer-user">
                    <div>
                        <strong data-developer-name>System Administrator</strong>
                        <span data-developer-role>developer</span>
                    </div>
                    <div class="developer-avatar">
                        <i class="fas fa-user-gear"></i>
                    </div>
                    <button class="icon-button danger" type="button" id="developerLogout" title="Log out" aria-label="Log out">
                        <i class="fas fa-right-from-bracket"></i>
                    </button>
                </div>
            </header>

            <section class="developer-panel active" id="logsPanel" data-panel="logs">
                <article class="section-card">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">Audit Trail</p>
                            <h3>System Logs</h3>
                        </div>
                        <div class="toolbar-row narrow">
                            <select id="logLevelFilter" class="form-control compact-control" aria-label="Filter logs">
                                <option value="all">All levels</option>
                                <option value="info">Info</option>
                                <option value="warning">Warning</option>
                                <option value="critical">Critical</option>
                            </select>
                            <button class="btn-secondary" type="button" id="exportLogs">
                                <i class="fas fa-file-export"></i>
                                Export
                            </button>
                        </div>
                    </div>
                    <div class="log-feed" id="systemLogFeed"></div>
                </article>
            </section>
        </main>
    </div>

    <div class="toast" id="developerToast" role="status" aria-live="polite"></div>
    <script src="DeveloperCommon.js"></script>
</body>
</html>
