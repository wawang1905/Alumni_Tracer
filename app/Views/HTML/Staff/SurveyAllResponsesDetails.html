<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Survey Response Details | GradVision</title>
    <link rel="icon" type="image/x-icon" href="../images/gradvision-logo.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="StaffCommon.css">
    <!-- Sidebar state pre-applied before paint to prevent transition flash -->
    <script>
        (function() {
            document.documentElement.classList.add('sidebar-preload');
            if (localStorage.getItem('staffSidebarCollapsed') === 'true') {
                document.documentElement.classList.add('staff-sidebar-collapsed');
            }
        })();
    </script>
</head>
<body class="staff-survey-response-detail-page has-staff-breadcrumbs">
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-wrap">
                    <div class="sidebar-logo-icon">
                        <img src="../images/gradvision-logo.ico" alt="GradVision Logo" class="sidebar-brand-logo">
                    </div>
                    <h2>GradVision</h2>
                </div>
                <p>Head Admin</p>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="location.href='Dashboard.html'">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </div>
                <div class="menu-item" onclick="location.href='AlumniManagement.html'">
                    <i class="fas fa-users"></i>
                    <span>Alumni Management</span>
                </div>
                <div class="menu-item" onclick="location.href='Coordinators.html'">
                    <i class="fas fa-user-tie"></i>
                    <span>Coordinators</span>
                </div>
                <div class="menu-item" onclick="location.href='Events.html'">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Events</span>
                </div>
                <div class="menu-item" onclick="location.href='News.html'">
                    <i class="fas fa-newspaper"></i>
                    <span>News</span>
                </div>
                <div class="menu-item active" onclick="location.href='Surveys.html'">
                    <i class="fas fa-file-alt"></i>
                    <span>Surveys</span>
                </div>
                <div class="menu-item" onclick="location.href='Reports.html'">
                    <i class="fas fa-chart-line"></i>
                    <span>Reports</span>
                </div>
                <div class="menu-item" onclick="location.href='Settings.html'">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </div>
            </div>
            <div class="sidebar-footer">
                <button id="staffLogoutBtn" class="sidebar-logout-btn" type="button" title="Log Out">
                    <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="staff-sticky-navigation">
                <div class="top-bar">
                    <div>
                        <div class="page-title">Overall Survey Response Details</div>
                    </div>
                    <div class="staff-info">
                        <span class="staff-name">Sarah Johnson</span>
                        <div class="staff-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                </div>

                <div class="staff-breadcrumb-bar">
                    <span class="breadcrumb-location-label"><i class="fas fa-location-dot" aria-hidden="true"></i> You are here</span>
                    <nav class="staff-breadcrumbs" aria-label="Breadcrumb">
                        <ol>
                            <li><a href="Surveys.html"><i class="fas fa-file-alt" aria-hidden="true"></i> Surveys</a></li>
                            <li><a id="allResponsesBreadcrumb" href="Surveys.html">Response Records</a></li>
                            <li aria-current="page">All Response Details</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div class="section-card response-detail-summary">
                <div class="response-detail-top" style="border-bottom: 0; padding-bottom: 0;">
                    <div class="response-detail-meta" style="padding-top: 0; grid-template-columns: auto auto; gap: 32px;">
                        <div class="response-meta-item">
                            <small>Survey</small>
                            <strong id="overviewSurveyTitle">-</strong>
                        </div>
                        <div class="response-meta-item">
                            <small>Total Responses</small>
                            <strong id="overviewTotalResponses">0</strong>
                        </div>
                    </div>
                    <button class="response-detail-back" type="button" onclick="location.href='Surveys.html'">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i>
                        <span>Back</span>
                    </button>
                </div>
            </div>

            <div class="response-detail-body">
                <div class="response-detail-section-bar">
                    <h3>All Respondent Submissions</h3>
                </div>
                <div id="allResponsesContainer" class="response-detail-answers"></div>
            </div>
        </div>
    </div>

    <script src="StaffCommon.js"></script>
    <script>
        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function getSurveyResponsesApiUrl(surveyId) {
            return new URL(`../surveys/${encodeURIComponent(surveyId)}/responses`, window.location.href).toString();
        }

        function getSurveyIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const id = Number(params.get('surveyId'));
            return Number.isFinite(id) ? id : null;
        }

        async function renderAllResponseDetails() {
            const surveyId = getSurveyIdFromUrl();
            const container = document.getElementById('allResponsesContainer');

            if (!surveyId) {
                container.innerHTML = '<div class="response-detail-loading">Survey details not found.</div>';
                return;
            }

            let payload;
            try {
                const response = await fetch(getSurveyResponsesApiUrl(surveyId), {
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                payload = await response.json();
                if (!response.ok || !payload.success) {
                    throw new Error('Survey not found.');
                }
            } catch (error) {
                container.innerHTML = '<div class="response-detail-loading">Survey details not found.</div>';
                return;
            }

            const survey = payload.survey;
            const responses = Array.isArray(payload.responses) ? payload.responses : [];

            if (survey?.id) {
                document.getElementById('allResponsesBreadcrumb').href = `SurveyResponses.html?surveyId=${encodeURIComponent(survey.id)}`;
            }

            document.getElementById('overviewSurveyTitle').textContent = survey ? survey.title : '-';
            document.getElementById('overviewTotalResponses').textContent = responses.length;

            if (!survey) {
                container.innerHTML = '<div class="response-detail-loading">Survey record does not exist.</div>';
                return;
            }

            if (responses.length === 0) {
                container.innerHTML = '<div class="response-detail-loading">No responses recorded yet for this survey.</div>';
                return;
            }

            container.innerHTML = responses.map((response, responseIndex) => `
                <section class="response-category-group">
                    <div class="response-category-heading">
                        <div class="response-category-title-wrap">
                            <span class="response-category-number">${responseIndex + 1}</span>
                            <div class="response-category-copy">
                                <h3>${escapeHtml(response.alumniName)}</h3>
                            </div>
                        </div>
                        <span class="response-category-count">Submitted ${escapeHtml(response.submittedAt)}</span>
                    </div>
                    <div class="response-category-answers">
                        ${response.answers && response.answers.length > 0 ? response.answers.map((answer, answerIndex) => {
                            const hasValue = answer.value !== null && answer.value !== undefined && String(answer.value).trim() !== '';
                            return `
                            <article class="response-answer-card">
                                <div class="response-answer-question">
                                    <span class="response-q-index">Q${answerIndex + 1}</span>
                                    <h4>${escapeHtml(answer.questionText)}</h4>
                                </div>
                                ${answer.imageUrl
                                    ? `<div class="response-answer-value response-answer-image">
                                        <a href="${escapeHtml(answer.imageUrl)}" target="_blank" rel="noopener noreferrer">
                                            <img src="${escapeHtml(answer.imageUrl)}" alt="Survey answer image">
                                        </a>
                                    </div>`
                                    : `<div class="response-answer-value">
                                        <p class="${hasValue ? '' : 'is-empty'}">${escapeHtml(hasValue ? answer.value : 'No answer provided')}</p>
                                    </div>`}
                            </article>
                        `;
                        }).join('') : '<div class="response-category-empty">No answers saved.</div>'}
                    </div>
                </section>
            `).join('');
        }

        renderAllResponseDetails();
    </script>
</body>
</html>
