<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | GradVision</title>
    <link rel="icon" type="image/x-icon" href="../images/gradvision-logo.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="StaffCommon.css">
    <!-- Sidebar state pre-applied before paint to prevent transition flash -->
    <script>
        (function() {
            document.documentElement.classList.add('sidebar-preload');
            if (localStorage.getItem('staffSidebarCollapsed') === 'true') {
                document.documentElement.classList.add('staff-sidebar-collapsed');
            }
        })();
    </script></head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-wrap">
                    <div class="sidebar-logo-icon">
                        <img src="../images/gradvision-logo.ico" alt="GradVision Logo" class="sidebar-brand-logo">
                    </div>
                    <h2>GradVision</h2>
                </div>
                <p>Head Admin</p>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item" data-page="dashboard" onclick="location.href='Dashboard.html'">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </div>
                <div class="menu-item" data-page="alumni" onclick="location.href='AlumniManagement.html'">
                    <i class="fas fa-users"></i>
                    <span>Alumni Management</span>
                </div>
                <div class="menu-item" data-page="coordinators" onclick="location.href='Coordinators.html'">
                    <i class="fas fa-user-tie"></i>
                    <span>Coordinators</span>
                </div>
                <div class="menu-item" data-page="events" onclick="location.href='Events.html'">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Events</span>
                </div>
                <div class="menu-item" data-page="news" onclick="location.href='News.html'">
                    <i class="fas fa-newspaper"></i>
                    <span>News</span>
                </div>
                <div class="menu-item" data-page="surveys" onclick="location.href='Surveys.html'">
                    <i class="fas fa-file-alt"></i>
                    <span>Surveys</span>
                </div>
                <div class="menu-item" data-page="reports" onclick="location.href='Reports.html'">
                    <i class="fas fa-chart-line"></i>
                    <span>Reports</span>
                </div>
                <div class="menu-item active" data-page="settings" onclick="location.href='Settings.html'">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </div>
            
            </div>
            <div class="sidebar-footer">
                <button id="staffLogoutBtn" class="sidebar-logout-btn" type="button" title="Log Out">
                    <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <div class="page-title" id="pageTitle">System Settings</div>
                <div class="staff-info">
                    <span class="staff-name">Sarah Johnson</span>
                    <div class="staff-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>

            <!-- Settings Page -->
            <div id="settingsPage">
                <div class="section-card">
                    <h3>System Settings</h3>
                    <p style="margin: 15px 0;">Configure notification preferences, email templates, and system integrations.</p>
                    <button class="btn-primary" onclick="alert('Settings saved (demo)')">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Alumni Modal -->
    <div id="addAlumniModal" class="modal">
        <div class="modal-content">
            <h3>Add New Alumni</h3>
            <input type="text" id="alumniName" placeholder="Full Name">
            <input type="text" id="alumniYear" placeholder="Graduation Year">
            <select id="alumniStatus">
                <option value="active">Active</option>
                <option value="pending">Pending</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeAddAlumniModal()">Cancel</button>
                <button class="btn-primary" onclick="addAlumni()">Add Alumni</button>
            </div>
        </div>
    </div>

    <!-- Create Event Modal -->
    <div id="createEventModal" class="modal">
        <div class="modal-content">
            <h3>Create New Event</h3>
            <input type="text" id="eventName" placeholder="Event Name">
            <input type="date" id="eventDate">
            <input type="text" id="eventLocation" placeholder="Location">
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeCreateEventModal()">Cancel</button>
                <button class="btn-primary" onclick="createEvent()">Create Event</button>
            </div>
        </div>
    </div>

    <script src="StaffCommon.js"></script>
</body>
</html>
