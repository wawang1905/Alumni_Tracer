<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTP Alumni Tracer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="AlumniCommon.css">
</head>
<body class="alumni-news-page">
    <div class="alumni-shell">
        <div class="alumni-sidebar-overlay" id="alumniSidebarOverlay"></div>
        <aside class="alumni-sidebar" id="alumniSidebar">
            <div class="alumni-brand">
                <h2>Alumni Tracker</h2>
                <p>Navigation</p>
            </div>
            <nav class="alumni-menu">
                <a class="alumni-menu-item" href="Main.html"><i class="fas fa-house"></i><span>Main Page</span></a>
                <a class="alumni-menu-item" href="Events.html"><i class="fas fa-calendar-alt"></i><span>Events</span></a>
                <a class="alumni-menu-item active" href="News.html"><i class="fas fa-bullhorn"></i><span>News</span></a>
                <a class="alumni-menu-item" href="Surveys.html" data-nav-survey><i class="fas fa-clipboard-list"></i><span>Survey</span><span class="alumni-menu-dot" id="surveyNavNotificationDot" aria-hidden="true"></span></a>
            </nav>
            <div class="alumni-sidebar-profile" data-profile-menu>
                <button class="alumni-profile-trigger" data-profile-trigger type="button" aria-expanded="false">
                    <span class="alumni-avatar"><i class="fas fa-user"></i></span>
                    <span class="alumni-profile-copy">
                        <strong data-alumni-user-name>Alumni User</strong>
                        <small data-alumni-user-role>alumni</small>
                    </span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="alumni-profile-dropdown" data-profile-dropdown>
                    <a class="alumni-dropdown-item" href="Profile.html">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                    <button class="alumni-dropdown-item danger" data-logout-button type="button">
                        <i class="fas fa-right-from-bracket"></i>
                        <span>Log Out</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="alumni-content">
            <header class="alumni-topbar">
                <div class="alumni-topbar-left">
                    <button class="alumni-menu-toggle" id="menuToggleButton" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="alumniSidebar">
                        <i class="fas fa-bars"></i>
                        <span class="alumni-menu-dot" id="menuToggleNotificationDot" aria-hidden="true"></span>
                    </button>
                    <div class="page-title-block">
                        <h1>Community News Feed</h1>
                        <!-- <p>Stories, announcements, and photo updates from the SEAIT staff office.</p> -->
                    </div>
                </div>
                <div class="alumni-topbar-actions" data-profile-menu>
                    <button class="alumni-profile-trigger alumni-profile-trigger--icon" data-profile-trigger type="button" aria-label="Open profile menu" aria-expanded="false">
                        <span class="alumni-avatar"><i class="fas fa-user"></i></span>
                    </button>
                    <div class="alumni-profile-dropdown" data-profile-dropdown>
                        <div class="alumni-dropdown-user">
                            <strong data-alumni-user-name>Alumni User</strong>
                            <small data-alumni-user-role>alumni</small>
                        </div>
                        <a class="alumni-dropdown-item" href="Profile.html">
                            <i class="fas fa-user"></i>
                            <span>Profile</span>
                        </a>
                        <button class="alumni-dropdown-item danger" data-logout-button type="button">
                            <i class="fas fa-right-from-bracket"></i>
                            <span>Log Out</span>
                        </button>
                    </div>
                </div>
            </header>

            <section class="news-feed-shell">
                <aside class="news-feed-side">
                    <div class="content-card news-side-card">
                        <h3>News Dashboard</h3>
                        <p>Stay connected with school milestones, alumni highlights, and official campus updates.</p>
                        <div class="news-side-pills">
                            <span class="news-side-pill"><i class="fas fa-bolt"></i> Fresh updates</span>
                            <span class="news-side-pill"><i class="fas fa-image"></i> Photo stories</span>
                            <span class="news-side-pill"><i class="fas fa-users"></i> Alumni community</span>
                        </div>
                    </div>
                </aside>

                <div id="alumniNewsGrid" class="news-facebook-feed"></div>
            </section>
        </main>
    </div>

    <script src="AlumniCommon.js"></script>
</body>
</html>
